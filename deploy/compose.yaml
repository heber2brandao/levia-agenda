name: levia
x-api: &api
  image: levia-api:${RELEASE_TAG:-local}
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file: .env.backend
  environment:
    LEVIA_ENVIRONMENT: production
  read_only: true
  tmpfs: [/tmp]
  volumes:
    - ./secrets/postgres-ca.crt:/run/secrets/postgres-ca.crt:ro
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true
  restart: unless-stopped
  networks: [app]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  api:
    <<: *api
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  web:
    image: levia-web:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN:?Configure DOMAIN}/api/v1
        VITE_SUPABASE_URL: ${SUPABASE_ORIGIN:?Configure SUPABASE_ORIGIN}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Configure a chave PUBLICAVEL}
    environment:
      DOMAIN: ${DOMAIN}
      SUPABASE_ORIGIN: ${SUPABASE_ORIGIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    networks:
      app:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  worker:
    <<: *api
    profiles: [email]
    command: [python, -m, app.worker]
    depends_on:
      api:
        condition: service_healthy
networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  caddy_data:
  caddy_config:
